crons:
  - name: tareas-diarias
    description: "Envia a cada vendedor el resumen por email de sus tareas vencidas y de hoy"
    cron: "0 8 * * *"
    timezone: "Europe/Madrid"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-digest"
    method: POST
    enabled: true
